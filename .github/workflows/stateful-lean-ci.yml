name: stateful-lean-ci

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "packages/contracts/**"
      - "packages/state-models/**"
      - "packages/monadic-lowering/**"
      - "specs/verification/v0.7/**"
      - "examples/software/06-bank-state.model.json"
      - "examples/software/06-bank-transfer-monadic-contract.ps"
      - "examples/software/07-bank-debit-stateful-vc.ps"
      - "examples/software/08-bank-debit-frame-stateful-vc.ps"
      - "examples/software/10-bank-audit-logical-stateful-vc.ps"
      - "tools/ps3-stateful-lean-*.ts"
      - ".github/workflows/stateful-lean-ci.yml"
  push:
    branches:
      - main
      - cleanup/ps1-architecture
      - product/v1-completion
    paths:
      - "packages/contracts/**"
      - "packages/state-models/**"
      - "packages/monadic-lowering/**"
      - "specs/verification/v0.7/**"
      - "examples/software/06-bank-state.model.json"
      - "examples/software/06-bank-transfer-monadic-contract.ps"
      - "examples/software/07-bank-debit-stateful-vc.ps"
      - "tools/ps3-stateful-lean-*.ts"
      - ".github/workflows/stateful-lean-ci.yml"

jobs:
  resolve-lean-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - name: Resolve compatibility floor, latest stable, and latest RC
        id: resolve
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          floor = "v4.33.1"
          request = urllib.request.Request(
              "https://api.github.com/repos/leanprover/lean4/releases?per_page=30",
              headers={"Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(request) as response:
              releases = json.load(response)

          stable = next(
              release["tag_name"]
              for release in releases
              if not release.get("draft") and not release.get("prerelease")
          )
          rc = next(
              (
                  release["tag_name"]
                  for release in releases
                  if not release.get("draft")
                  and release.get("prerelease")
                  and "-rc" in release["tag_name"]
              ),
              None,
          )

          versions = []
          for version in (floor, stable, rc):
              if version and version not in versions:
                  versions.append(version)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("versions=" + json.dumps(versions) + "\n")

          print("Lean compatibility lanes:", ", ".join(versions))
          PY

  stateful-vc:
    needs: resolve-lean-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lean: ${{ fromJson(needs.resolve-lean-versions.outputs.versions) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Select Lean compatibility lane
        shell: bash
        run: |
          printf '%s\n' 'leanprover/lean4:${{ matrix.lean }}' > specs/verification/v0.7/lean/lean-toolchain
          cat specs/verification/v0.7/lean/lean-toolchain

      - name: Set up Lean verification project
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: specs/verification/v0.7/lean
          build: true
          test: false
          use-mathlib-cache: false

      - name: Record actual Lean version
        working-directory: specs/verification/v0.7/lean
        run: |
          lake env lean --version

      - name: Execute generated debit stateful VC request
        run: npm run assurance:ps3:stateful-lean-vc -- --require-proof --out stateful-vc-run-${{ matrix.lean }}.json

      - name: Execute generated transfer stateful VC request
        run: npm run assurance:ps3:stateful-lean-transfer-vc -- --require-proof --out stateful-transfer-vc-run-${{ matrix.lean }}.json

      - name: Execute generated frame stateful VC request
        run: npm run assurance:ps3:stateful-lean-frame-vc -- --require-proof --out stateful-frame-vc-run-${{ matrix.lean }}.json

      - name: Execute generated logical stateful VC request
        run: npm run assurance:ps3:stateful-lean-logical-vc -- --require-proof --out stateful-logical-vc-run-${{ matrix.lean }}.json

      - name: Upload stateful VC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateful-vc-run-${{ matrix.lean }}
          path: stateful-vc-run-${{ matrix.lean }}.json
          if-no-files-found: warn

      - name: Upload transfer stateful VC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateful-transfer-vc-run-${{ matrix.lean }}
          path: stateful-transfer-vc-run-${{ matrix.lean }}.json
          if-no-files-found: warn

      - name: Upload frame stateful VC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateful-frame-vc-run-${{ matrix.lean }}
          path: stateful-frame-vc-run-${{ matrix.lean }}.json
          if-no-files-found: warn

      - name: Upload logical stateful VC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateful-logical-vc-run-${{ matrix.lean }}
          path: stateful-logical-vc-run-${{ matrix.lean }}.json
          if-no-files-found: warn
