name: product-ci

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - cleanup/ps1-architecture

jobs:
  product-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:architecture:package-classification
      - run: npm run test:ps2:plugin-metadata
      - run: npm run test:ps2:project-metadata
      - run: npm run test:ps2:cli-project-profile
      - run: npm run test:ps2:feature-registry
      - run: npm run test:ps1:compiler-facade
      - run: npm run test:ps1:incremental
      - run: npm run test:ps1:language-service
      - run: npm run test:ps1:language-worker
      - run: npm run test:ps1:lsp
      - run: npm run test:reference:v061:c0
      - run: npm run test:reference:v061:c1-c2
      - run: npm run test:reference:v061:production-surface
      - run: npm run test:reference:v061:production-reference-parity
      - run: npm run test:ps3:pure-contracts
      - run: npm run test:ps3:monadic-contracts
      - run: npm run test:ka137
      - run: npm run test:ka140
      - run: npm run test:ka146
