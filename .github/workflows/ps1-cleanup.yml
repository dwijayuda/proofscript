name: ps1-cleanup

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - cleanup/ps1-architecture

jobs:
  ps1-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pin repository-compatible TypeScript for baseline build
        run: npm install --no-save --ignore-scripts typescript@5.9.3
      - run: npm run build
      - run: npm run test:ka137
      - run: npm run test:ka140
      - run: npm run test:ka146
